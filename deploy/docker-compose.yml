# 本地依赖编排：MySQL 8.4 LTS + Redis 7
#
# 用法（在 deploy/ 目录下）：
#   cp .env.example .env      # 改掉里面的密码
#   docker compose up -d      # 首次启动会自动执行 mysql/init/*.sql
#   docker compose ps         # 等两个服务都变成 healthy
#
# 只绑定 127.0.0.1：数据库和缓存不应暴露到局域网，容器之间走内网服务名。
# 端口冲突时改 .env 里的 MYSQL_PORT / REDIS_PORT，不要改容器内端口。

name: agent-chat

services:
  mysql:
    image: mysql:8.4
    container_name: agent-chat-mysql
    restart: unless-stopped
    environment:
      # 库名固定，不开放配置：init 脚本里写死了 USE agent_chat，
      # 允许改名会立刻造成两边不一致。
      MYSQL_DATABASE: agent_chat
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置，请先复制 .env.example 为 .env}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 未设置}
      # 迁移专用账号：拥有 DDL，只在 alembic 里用。
      # 运行时账号（MYSQL_USER）会被收权成只有 DML，见 mysql/initdb/10-grants.sh。
      # 留空 = 不收权（本地图省事），生产必须配。
      MYSQL_MIGRATOR_USER: ${MYSQL_MIGRATOR_USER:-migrator}
      MYSQL_MIGRATOR_PASSWORD: ${MYSQL_MIGRATOR_PASSWORD:-}
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      # 命名卷：数据在卷里，容器可随时重建。删数据请显式 docker compose down -v
      - mysql-data:/var/lib/mysql
      # 这里**只放权限脚本，不放 DDL**。表结构仍然只由 Alembic 管理：
      # 两处都定义 schema 必然漂移（实测注释和索引就对不上），
      # 而且 alembic_version 和自建的 schema_migrations 会互相打架。
      # 建表请执行：alembic upgrade head
      # 注意 initdb 只在数据目录为空时执行一次，已有数据的库要手动跑一次。
      - ./mysql/initdb:/docker-entrypoint-initdb.d:ro
      # 注意挂到 conf.d-src 而不是 /etc/mysql/conf.d：
      #   1) 直接挂 conf.d 会覆盖镜像自带的 mysql.cnf / mysqldump.cnf；
      #   2) 更要命的是 Windows 上 bind mount 权限恒为 0777，
      #      MySQL 见到 world-writable 的配置文件会直接忽略，且只在日志里留一行警告。
      #      实测后果：time_zone 仍是 SYSTEM、slow_query_log 仍是 0、max_connections 仍是 151。
      # 所以由 entrypoint 用 install 复制成 0644 再启动。
      - ./mysql/conf.d:/etc/mysql/conf.d-src:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        install -m 0644 /etc/mysql/conf.d-src/*.cnf /etc/mysql/conf.d/
        exec docker-entrypoint.sh mysqld
    healthcheck:
      # 不用 mysqladmin ping：它连密码错都返回 alive，等于没校验。
      # 这里跑一条真查询，把"进程活着"升级成"能认证、能查库"。
      test:
        - CMD-SHELL
        - mysql -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" -e "SELECT 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      # 首次启动要初始化数据目录 + 跑 init 脚本，给足时间
      start_period: 40s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    container_name: agent-chat-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 未设置}
    # 密码与 ACL 规则都不能写在 redis.conf 里（配置文件进版本库），
    # 也不能走命令行参数：Redis 会把命令行值整体加引号后当成一个 token，
    # ACL 解析时用户名里就带了空格，直接报
    # "Spaces not allowed in ACL usernames" 并拒绝启动。
    # 所以启动时把规则渲染进临时 aclfile（只存在于容器可写层，不落卷、不进仓库）。
    #
    # -@dangerous 摘掉 FLUSHALL / FLUSHDB / KEYS / CONFIG / DEBUG 等命令，
    # 比 rename-command 干净 —— 后者 Redis 7 已废弃，且会影响 AOF 命令回放。
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        printf 'user default on >%s ~* &* +@all -@dangerous\n' "$$REDIS_PASSWORD" > /tmp/users.acl
        chmod 600 /tmp/users.acl
        exec redis-server /usr/local/etc/redis/redis.conf --aclfile /tmp/users.acl
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  mysql-data:
    name: agent-chat-mysql-data
  redis-data:
    name: agent-chat-redis-data

networks:
  default:
    name: agent-chat-net
