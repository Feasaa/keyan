# Redis 7 配置：只做"流式写缓冲 + 上下文缓存"，不承担持久化真相源的角色。
# 密码不写在这里（配置文件进版本库），由 docker-compose 的 --requirepass 注入。

# ---- 网络 ----
bind 0.0.0.0
protected-mode no
port 6379
# 空闲连接超时：防止客户端崩溃后连接堆积
timeout 300
tcp-keepalive 60

# ---- 持久化 ----
# AOF 每次写入落盘（everysec = 最多丢 1 秒）。
# 这里要 AOF 不是为了当数据库用，而是容器重启后流式缓冲还在，
# 正在生成的消息不至于全丢。
appendonly yes
appendfsync everysec
# AOF 重写时不在主进程 fsync，避免重写期间写延迟抖动
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB 作为 AOF 之外的兜底快照
save 900 1
save 300 10

# ---- 内存 ----
maxmemory 512mb
# 只淘汰「带 TTL 的键」。
# 为什么不是 allkeys-lru：那会把没有 TTL 的键也淘汰掉，
# 上下文缓存被清空只是变慢，但缓冲键被清空就是消息丢失。
# 我们的缓存与缓冲都设了 TTL，所以 volatile-lru 能覆盖它们，
# 同时不会误伤将来可能加入的无 TTL 键。
maxmemory-policy volatile-lru

# ---- 慢日志 ----
# 超过 10ms 记一条：Redis 单线程，慢命令会阻塞所有客户端
slowlog-log-slower-than 10000
slowlog-max-len 128

# ---- 安全 ----
# 危险命令（FLUSHALL / FLUSHDB / KEYS / CONFIG / DEBUG ...）由 ACL 从 default
# 用户上摘掉，见 docker-compose 的 --user 参数。
#
# 这里刻意不用 rename-command：
#   1) Redis 7 已把它标记为 DEPRECATED，官方建议改用 ACL；
#   2) 它有明确警告 —— 改名会影响 AOF 里已记录的命令回放，
#      而我们开了 AOF，改名等于给自己埋一个启动失败的风险。
# 摘掉 @dangerous 整个类别，比逐个列出命令名更不容易漏。

# ---- 其他 ----
databases 16
loglevel notice
