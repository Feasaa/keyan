# conda 环境定义 —— 只负责"解释器 + pip"，不重复声明依赖版本。
#
#   创建：conda env create -f environment.yml      （在仓库根目录执行）
#   更新：conda env update -f environment.yml --prune
#   激活：conda activate fastapi-learn
#
# 为什么不把 pip 包一个个列在这里：
#   之前 environment.yml 和 requirements.txt 各维护一份完全相同的包列表，
#   加一个依赖要改两个文件，漏改一边就出现"conda 装的能跑、pip 装的报错"。
#   现在包版本只有 requirements*.txt 一个来源，这里用 -r 引用。

name: fastapi-learn

channels:
  - conda-forge

dependencies:
  # 3.11 是本项目的最低支持线（pyproject.toml 的 requires-python）。
  # 注意别用 3.13 起：passlib 依赖的 crypt 模块已被移除，本项目用 pwdlib 绕开了，
  # 但生态里其他老包未必。
  - python=3.11
  - pip
  - pip:
      # -r 的路径相对"执行 conda 命令时的工作目录"，所以必须在仓库根目录执行
      - -r requirements-dev.txt
