# conda 环境定义
#   创建：conda env create -f environment.yml
#   更新：conda env update -f environment.yml --prune
#   激活：conda activate fastapi-learn

name: fastapi-learn

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip

  # Web 框架与服务器（走 pip，版本比 conda 源更新）
  - pip:
      - fastapi>=0.115,<1.0
      - uvicorn[standard]>=0.30
      - pydantic-settings>=2.4
      - python-dotenv>=1.0

      # SSE（帧编码 / ping / 断线检测 / 优雅停机）
      - sse-starlette>=3.6

      # LLM（LangChain，OpenAI 兼容网关）
      - langchain>=1.4
      - langchain-openai>=1.7

      # 数据库（MySQL 8.4，异步驱动）
      - sqlalchemy[asyncio]>=2.0
      - aiomysql>=0.2
      - cryptography>=42
      - alembic>=1.13

      # 鉴权（argon2id 哈希 + JWT + 邮箱校验）
      - pwdlib[argon2,bcrypt]>=0.2
      - pyjwt>=2.8
      - email-validator>=2.1

      # Redis（验证码 / 限流）与异步 SMTP
      - redis[hiredis]>=5.1
      - aiosmtplib>=3.0

      # 测试
      - pytest>=8.0
      - httpx>=0.27

      # 代码检查 / 格式化，配置在 pyproject.toml 的 [tool.ruff]
      - ruff>=0.12
