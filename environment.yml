# conda 环境定义
#   创建：conda env create -f environment.yml
#   更新：conda env update -f environment.yml --prune
#   激活：conda activate fastapi-learn

name: fastapi-learn

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip

  # Web 框架与服务器（走 pip，版本比 conda 源更新）
  - pip:
      - fastapi>=0.115,<1.0
      - uvicorn[standard]>=0.30
      - pydantic-settings>=2.4
      - python-dotenv>=1.0

      # SSE（帧编码 / ping / 断线检测 / 优雅停机）
      - sse-starlette>=3.6

      # LLM（LangChain，OpenAI 兼容网关）
      - langchain>=1.4
      - langchain-openai>=1.7

      # 数据库（MySQL 8.4，异步驱动）
      - sqlalchemy[asyncio]>=2.0
      - aiomysql>=0.2
      - cryptography>=42

      # 测试
      - pytest>=8.0
      - httpx>=0.27
